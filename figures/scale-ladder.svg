<svg xmlns="http://www.w3.org/2000/svg" width="880" height="1128" viewBox="0 0 880 1128" role="img">
<rect width="880" height="1128" fill="#f4f0e8"/>
<rect x="10" y="10" width="860" height="1108" fill="none" stroke="#e4dccb"/>
<text x="28" y="46" fill="#5e574e" font-family="Inter, Liberation Sans, sans-serif" font-size="12" letter-spacing="0.16em">UNIVERSE MAP · FIGURE 1</text><text x="28" y="78" fill="#221e1a" font-family="Liberation Serif, Georgia, serif" font-size="28">Seven steps, one ladder</text><text x="28" y="104" fill="#5e574e" font-family="Inter, Liberation Sans, sans-serif" font-size="14">Drawn from the ORDER and LEVELS tables in src/addon.js. This is the current scale list.</text><rect x="28" y="128" width="14" height="14" rx="2" fill="#1a655c"/><text x="50" y="140" fill="#221e1a" font-family="Inter, Liberation Sans, sans-serif" font-size="12">Measured positions or true radii</text><rect x="278" y="128" width="14" height="14" rx="2" fill="#8a4e12"/><text x="300" y="140" fill="#221e1a" font-family="Inter, Liberation Sans, sans-serif" font-size="12">Schematic, shell, or a stated size boost</text><rect x="528" y="128" width="14" height="14" rx="2" fill="#243e66"/><text x="550" y="140" fill="#221e1a" font-family="Inter, Liberation Sans, sans-serif" font-size="12">Host-page geometry</text><rect x="28" y="164" width="824" height="118" rx="8" fill="#fffcf7" stroke="#e4dccb"/><rect x="28" y="164" width="6" height="118" rx="3" fill="#1a655c"/><text x="52" y="192" fill="#1a655c" font-family="Inter, Liberation Sans, sans-serif" font-size="13" font-weight="600">01</text><text x="84" y="192" fill="#221e1a" font-family="Liberation Serif, Georgia, serif" font-size="20">Earth</text><text x="836" y="192" text-anchor="end" fill="#1a655c" font-family="Inter, Liberation Sans, sans-serif" font-size="12" font-weight="600">True radii</text><text x="84" y="216" fill="#5e574e" font-family="Inter, Liberation Sans, sans-serif" font-size="13">1 au = 2 scene units</text><text x="84" y="238" fill="#221e1a" font-family="Inter, Liberation Sans, sans-serif" font-size="13">Sun, Earth, and Moon at their physical radii. Orbit lines are hidden.</text><text x="84" y="256" fill="#221e1a" font-family="Inter, Liberation Sans, sans-serif" font-size="13">Opens 5.5 Earth-mesh radii toward the Sun. near = 0.12 R, far = 900 R,</text><text x="84" y="274" fill="#5e574e" font-family="Inter, Liberation Sans, sans-serif" font-size="12">then power-of-two bins each frame. Bloom is off.</text><rect x="28" y="292" width="824" height="118" rx="8" fill="#fffcf7" stroke="#e4dccb"/><rect x="28" y="292" width="6" height="118" rx="3" fill="#8a4e12"/><text x="52" y="320" fill="#8a4e12" font-family="Inter, Liberation Sans, sans-serif" font-size="13" font-weight="600">02</text><text x="84" y="320" fill="#221e1a" font-family="Liberation Serif, Georgia, serif" font-size="20">Solar system</text><text x="836" y="320" text-anchor="end" fill="#8a4e12" font-family="Inter, Liberation Sans, sans-serif" font-size="12" font-weight="600">Explore boost</text><text x="84" y="344" fill="#5e574e" font-family="Inter, Liberation Sans, sans-serif" font-size="13">1 au = 2 scene units</text><text x="84" y="366" fill="#221e1a" font-family="Inter, Liberation Sans, sans-serif" font-size="13">Eight orbits stay true. Explore draws planets ×360 and the Sun ×4, and hides the Moon.</text><text x="84" y="384" fill="#221e1a" font-family="Inter, Liberation Sans, sans-serif" font-size="13">Research uses factor 1 and shows the Moon. near 0.05, far 5,000,</text><text x="84" y="402" fill="#5e574e" font-family="Inter, Liberation Sans, sans-serif" font-size="12">orbit distance 2–600. Bloom strength 0.22.</text><rect x="28" y="420" width="824" height="118" rx="8" fill="#fffcf7" stroke="#e4dccb"/><rect x="28" y="420" width="6" height="118" rx="3" fill="#1a655c"/><text x="52" y="448" fill="#1a655c" font-family="Inter, Liberation Sans, sans-serif" font-size="13" font-weight="600">03</text><text x="84" y="448" fill="#221e1a" font-family="Liberation Serif, Georgia, serif" font-size="20">Nearby stars</text><text x="836" y="448" text-anchor="end" fill="#1a655c" font-family="Inter, Liberation Sans, sans-serif" font-size="12" font-weight="600">Measured positions</text><text x="84" y="472" fill="#5e574e" font-family="Inter, Liberation Sans, sans-serif" font-size="13">1 pc = 2 scene units</text><text x="84" y="494" fill="#221e1a" font-family="Inter, Liberation Sans, sans-serif" font-size="13">24,704 HYG v4.2 stars within 100 pc. 8,920 naked-eye directions sit on a shell at 110 pc.</text><text x="84" y="512" fill="#221e1a" font-family="Inter, Liberation Sans, sans-serif" font-size="13">near 0.5, far 20,000, home distance 320. The shell radius is a display choice.</text><text x="84" y="530" fill="#5e574e" font-family="Inter, Liberation Sans, sans-serif" font-size="12">Those points are directions, not distances.</text><rect x="28" y="548" width="824" height="118" rx="8" fill="#fffcf7" stroke="#e4dccb"/><rect x="28" y="548" width="6" height="118" rx="3" fill="#8a4e12"/><text x="52" y="576" fill="#8a4e12" font-family="Inter, Liberation Sans, sans-serif" font-size="13" font-weight="600">04</text><text x="84" y="576" fill="#221e1a" font-family="Liberation Serif, Georgia, serif" font-size="20">Milky Way</text><text x="836" y="576" text-anchor="end" fill="#8a4e12" font-family="Inter, Liberation Sans, sans-serif" font-size="12" font-weight="600">Schematic</text><text x="84" y="600" fill="#5e574e" font-family="Inter, Liberation Sans, sans-serif" font-size="13">1 kpc = 20 scene units</text><text x="84" y="622" fill="#221e1a" font-family="Inter, Liberation Sans, sans-serif" font-size="13">186,819-point sample, a 15 kpc cylinder, and a 5 kpc bar. The Sun is the origin.</text><text x="84" y="640" fill="#221e1a" font-family="Inter, Liberation Sans, sans-serif" font-size="13">near 1, far 20,000, home 1,600. Bloom is off. Arm pitch is 12.5°, an idealised spiral.</text><text x="84" y="658" fill="#5e574e" font-family="Inter, Liberation Sans, sans-serif" font-size="12">Xu et al. 2023 is a citation. It is not this geometry.</text><rect x="28" y="676" width="824" height="118" rx="8" fill="#fffcf7" stroke="#e4dccb"/><rect x="28" y="676" width="6" height="118" rx="3" fill="#1a655c"/><text x="52" y="704" fill="#1a655c" font-family="Inter, Liberation Sans, sans-serif" font-size="13" font-weight="600">05</text><text x="84" y="704" fill="#221e1a" font-family="Liberation Serif, Georgia, serif" font-size="20">Local Group</text><text x="836" y="704" text-anchor="end" fill="#1a655c" font-family="Inter, Liberation Sans, sans-serif" font-size="12" font-weight="600">Published distances</text><text x="84" y="728" fill="#5e574e" font-family="Inter, Liberation Sans, sans-serif" font-size="13">1 kpc = 0.5 scene units</text><text x="84" y="750" fill="#221e1a" font-family="Inter, Liberation Sans, sans-serif" font-size="13">22 named members, a 15 kpc Milky Way circle, and a 200 kpc bar. The point sample is hidden.</text><text x="84" y="768" fill="#221e1a" font-family="Inter, Liberation Sans, sans-serif" font-size="13">near 0.2, far 40,000. The camera frames the Sun–M31 midpoint.</text><text x="84" y="786" fill="#5e574e" font-family="Inter, Liberation Sans, sans-serif" font-size="12">Circles lie in the Milky Way plane. Inclination is not applied.</text><rect x="28" y="804" width="824" height="118" rx="8" fill="#fffcf7" stroke="#e4dccb"/><rect x="28" y="804" width="6" height="118" rx="3" fill="#1a655c"/><text x="52" y="832" fill="#1a655c" font-family="Inter, Liberation Sans, sans-serif" font-size="13" font-weight="600">06</text><text x="84" y="832" fill="#221e1a" font-family="Liberation Serif, Georgia, serif" font-size="20">Galaxies</text><text x="836" y="832" text-anchor="end" fill="#1a655c" font-family="Inter, Liberation Sans, sans-serif" font-size="12" font-weight="600">Packed catalogs</text><text x="84" y="856" fill="#5e574e" font-family="Inter, Liberation Sans, sans-serif" font-size="13">1 Mpc/h = 1 scene unit</text><text x="84" y="878" fill="#221e1a" font-family="Inter, Liberation Sans, sans-serif" font-size="13">287,758 galaxies and the dipole, with the host flow lines, isosurfaces, and rings.</text><text x="84" y="896" fill="#221e1a" font-family="Inter, Liberation Sans, sans-serif" font-size="13">near 1, far 5,000, home 512. Point size parameter 320, clamped by depth.</text><text x="84" y="914" fill="#5e574e" font-family="Inter, Liberation Sans, sans-serif" font-size="12">h = 0.75. SDSS and DESI remain a northern wedge.</text><rect x="28" y="932" width="824" height="118" rx="8" fill="#fffcf7" stroke="#e4dccb"/><rect x="28" y="932" width="6" height="118" rx="3" fill="#243e66"/><text x="52" y="960" fill="#243e66" font-family="Inter, Liberation Sans, sans-serif" font-size="13" font-weight="600">07</text><text x="84" y="960" fill="#221e1a" font-family="Liberation Serif, Georgia, serif" font-size="20">Superclusters</text><text x="836" y="960" text-anchor="end" fill="#243e66" font-family="Inter, Liberation Sans, sans-serif" font-size="12" font-weight="600">Host page meshes</text><text x="84" y="984" fill="#5e574e" font-family="Inter, Liberation Sans, sans-serif" font-size="13">1 Mpc/h = 1 scene unit</text><text x="84" y="1006" fill="#221e1a" font-family="Inter, Liberation Sans, sans-serif" font-size="13">Basin meshes already in the host page, plus the galaxy and dipole layers.</text><text x="84" y="1024" fill="#221e1a" font-family="Inter, Liberation Sans, sans-serif" font-size="13">near 1, far 12,000, home 900. superclusters.js does not rebuild those meshes.</text><text x="84" y="1042" fill="#5e574e" font-family="Inter, Liberation Sans, sans-serif" font-size="12">Ten basins at smoothing 0, seven at smoothing 10.</text><text x="28" y="1106" fill="#5e574e" font-family="Inter, Liberation Sans, sans-serif" font-size="11">Entering a step rescales every layer and sets visibility. There is no mesh level of detail.  ·  6 Nov 2026</text>
</svg>
